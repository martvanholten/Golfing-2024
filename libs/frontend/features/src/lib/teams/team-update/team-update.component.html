<div class="text-center p-2">
    <div class="col-xs-1 border" align="center">
        <form
            #teamEditForm = "ngForm"
            name="form"
            (ngSubmit)="teamEditForm.form.valid && onSubmit()"
            novalidate
        >
            <div class="bg-success text-white text-center m-2 p-2 font-weight-bold">
                <h5>Team</h5>
            </div>
            <div class="text-success">
                <h6 class="font-weight-bold">Team informatie</h6>
            </div>
            <div class="row font-weight-bold">
                <div class="col text-success">
                    <label for="Name">
                        Naam:
                    </label>
                </div>
                <div class="col text-success">
                    <label for="largeGames">
                        Doet 18 holes:
                    </label>
                </div>
            </div>
            <div class="row text-success">
                <div class="col">
                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="team.name"
                        name="name"
                        #name="ngModel"
                        [ngClass]="{
                            'is-invalid': name.invalid
                        }"
                        required
                    />
                </div>
                <div
                    *ngIf="name.invalid && name.touched"
                    class="invalid-feedback"
                >
                    <div>Naam moet gevuld zijn.</div>
                </div>
                <div class="col">
                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="team.largeGames"
                        name="largeGames"
                        #largeGames="ngModel"
                        [ngClass]="{
                            'is-invalid': largeGames.invalid
                        }"
                        required
                    />
                </div>   
                <div
                    *ngIf="largeGames.invalid && largeGames.touched"
                    class="invalid-feedback"
                >
                    <div>Moet aangegeven of ze 18 holes spelen.</div>
                </div>            
            </div>
            <div class="row font-weight-bold">
                <button
                    type = "submit"
                    class="btn btn-success mt-3"
                    [disabled]="!teamEditForm.valid"
                >
                    Save
                </button>
                <button
                    type = "button"
                    class="btn btn-success mt-3"
                    routerLink=".."
                >
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
