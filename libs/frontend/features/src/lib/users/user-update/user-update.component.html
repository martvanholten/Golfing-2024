<div class="text-center p-2">
    <div class="col-xs-1 border" align="center">
        <form
            #userEditForm = "ngForm"
            name="form"
            (ngSubmit)="userEditForm.form.valid && onSubmit()"
            novalidate
        >
            <div class="bg-success text-white text-center m-2 p-2 font-weight-bold">
                <h5>Golfer {{user.firstName}} {{user.lastName}}</h5>
            </div>
            <div class="text-success">
                <h6 class="font-weight-bold">Golfer informatie</h6>
            </div>
            <div class="row font-weight-bold">
                <div class="col text-success">
                    <label for="firstName">
                        Voor naam:
                    </label>
                </div>
                <div class="col text-success">
                    <label for="lastName">
                        Achter naam:
                    </label>
                </div>
            </div>
            <div class="row text-success">
                <div class="col">
                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="user.firstName"
                        name="firstName"
                        #firstName="ngModel"
                        [ngClass]="{
                            'is-invalid': firstName.invalid
                        }"
                        required
                    />
                </div>
                <div
                    *ngIf="firstName.invalid && firstName.touched"
                    class="invalid-feedback"
                >
                    <div>Voor naam moet gevuld zijn.</div>
                </div>
                <div class="col">
                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="user.lastName"
                        name="lastName"
                        #lastName="ngModel"
                        [ngClass]="{
                            'is-invalid': lastName.invalid
                        }"
                        required
                    />
                </div>   
                <div
                    *ngIf="lastName.invalid && lastName.touched"
                    class="invalid-feedback"
                >
                    <div>Achternaam naam moet gevuld zijn.</div>
                </div>            
            </div>
            <div class="row font-weight-bold">
                <div class="col text-success"><label for="handicap">Handicap:</label></div>
                <div class="col text-success"><label for="age">Leeftijd:</label></div>
            </div>
            <div class="row text-success">
                <div class="col">
                    <input
                        type="number"
                        class="form-control"
                        [(ngModel)]="user.handicap"
                        name="handicap"
                        #handicap="ngModel"
                        [ngClass]="{
                            'is-invalid': handicap.invalid
                        }"
                        required
                    />
                </div>
                <div
                    *ngIf="handicap.invalid && handicap.touched"
                    class="invalid-feedback"
                >
                    <div>Handicap naam moet gevuld zijn.</div>
                </div>
                <div class="col">
                    <input
                        type="number"
                        class="form-control"
                        [(ngModel)]="user.age"
                        name="age"
                        #age="ngModel"
                        [ngClass]="{
                            'is-invalid': age.invalid
                        }"
                        required
                    />
                </div>               
            </div>
            <hr>
            <div class="text-success">
                <h6 class="font-weight-bold">Contact informatie</h6>
            </div>
            <div class="row font-weight-bold">
                <div class="col text-success"><label for="email">Email:</label></div>
                <div class="col text-success"><label for="role">Rol:</label></div>
            </div>
            <div class="row text-success">
                <div class="col">
                    <input
                        type="email"
                        class="form-control"
                        [(ngModel)]="user.email"
                        name="email"
                        #email="ngModel"
                        [ngClass]="{
                            'is-invalid': email.invalid
                        }"
                        required
                    />
                </div>
                <div
                    *ngIf="email.invalid && email.touched"
                    class="invalid-feedback"
                >
                    <div>Email moet een geldige email zijn.</div>
                </div>
                <div class="col">
                    <select
                        class="form-control"
                        [(ngModel)]="user.role"
                        name="role"
                        #role="ngModel"
                        [ngClass]="{
                            'is-invalid': role.invalid
                        }"
                        required
                    >
                        <option value="member">Team lid</option>
                        <option value="team captain">Team capitein</option>
                    </select>
                </div>
            </div>
            <hr>
            <div class="text-success">
                <h6 class="font-weight-bold">Account informatie</h6>
            </div>
            <div class="row font-weight-bold">
                <div class="col text-success"><label for="password">Wachtwoord:</label></div>
            </div>
            <div class="row text-success">
                <div class="col">
                    <input
                        type="password"
                        class="form-control"
                        [(ngModel)]="user.password"
                        name="password"
                        #password="ngModel"
                        [ngClass]="{
                            'is-invalid': password.invalid
                        }"
                        required
                    />
                </div>
                <div
                    *ngIf="password.invalid && password.touched"
                    class="invalid-feedback"
                >
                    <div>Wachtwoord moet ingevult zijn.</div>
                </div>
            </div>
            <div class="row font-weight-bold">
                <button
                    type = "submit"
                    class="btn btn-success mt-3"
                    [disabled]="!userEditForm.valid"
                >
                    Save
                </button>
                <button
                    type = "button"
                    class="btn btn-success mt-3"
                    routerLink=".."
                >
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
