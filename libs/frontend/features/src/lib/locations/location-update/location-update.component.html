<div class="text-center p-2">
    <div class="col-xs-1 border" align="center">
        <form
            #locationEditForm = "ngForm"
            name="form"
            (ngSubmit)="locationEditForm.form.valid && onSubmit()"
            novalidate
        >
            <div class="bg-success text-white text-center m-2 p-2 font-weight-bold">
                <h5>location</h5>
            </div>
            <div class="text-success">
                <h6 class="font-weight-bold">location informatie</h6>
            </div>
            <div class="row font-weight-bold">
                <div class="col text-success">
                    <label for="name">
                        Naam:
                    </label>
                </div>
                <div class="col text-success">
                    <label for="large">
                        Holes:
                    </label>
                </div>
            </div>
            <div class="row text-success">
                <div class="col">
                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="location.name"
                        name="name"
                        #name="ngModel"
                        [ngClass]="{
                            'is-invalid': name.invalid
                        }"
                        required
                    />
                </div>   
                <div
                    *ngIf="name.invalid && name.touched"
                    class="invalid-feedback"
                >
                    <div>Moet een naam invullen.</div>
                </div>
                <div class="col">
                    <select
                        class="form-control"
                        [(ngModel)]="location.large"
                        name="large"
                        #large="ngModel"
                        [ngClass]="{
                            'is-invalid': large.invalid
                        }"
                        required
                    >
                        <option value=true>9</option>
                        <option value=false>18</option>
                    </select>
                </div>   
                <div
                    *ngIf="large.invalid && large.touched"
                    class="invalid-feedback"
                >
                    <div>Moet aangegeven of ze 18 holes kunnen spelen.</div>
                </div>            
            </div>
            <hr>
            <div class="text-success">
                <h6 class="font-weight-bold">Address informatie</h6>
            </div>
            <div class="row font-weight-bold">
                <div class="col text-success"><label for="city">Stad:</label></div>
                <div class="col text-success"><label for="address">Straat:</label></div>
                <div class="col text-success"><label for="houseNumber">Huisnummer:</label></div>
            </div>
            <div class="row text-success">
                <div class="col">
                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="location.city"
                        name="city"
                        #city="ngModel"
                        [ngClass]="{
                            'is-invalid': city.invalid
                        }"
                        required
                    />
                </div>
                <div
                    *ngIf="city.invalid && city.touched"
                    class="invalid-feedback"
                >
                    <div>Stad moet gevuld zijn.</div>
                </div>
                <div class="col">
                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="location.address"
                        name="address"
                        #address="ngModel"
                        [ngClass]="{
                            'is-invalid': address.invalid
                        }"
                        required
                    />
                </div>
                <div
                    *ngIf="address.invalid && address.touched"
                    class="invalid-feedback"
                >
                    <div>Straat moet gevuld zijn.</div>
                </div>
                <div class="col">
                    <input
                        type="number"
                        class="form-control"
                        [(ngModel)]="location.houseNumber"
                        name="houseNumber"
                        #houseNumber="ngModel"
                        [ngClass]="{
                            'is-invalid': houseNumber.invalid
                        }"
                        required
                    />
                </div>
                <div
                    *ngIf="houseNumber.invalid && houseNumber.touched"
                    class="invalid-feedback"
                >
                    <div>Huisnummer moet gevuld zijn.</div>
                </div>
            </div>
            <hr>
            <div class="row font-weight-bold">
                <button
                    type = "submit"
                    class="btn btn-success mt-3"
                    [disabled]="!locationEditForm.valid"
                >
                    Save
                </button>
                <button
                    type = "button"
                    class="btn btn-success mt-3"
                    routerLink=".."
                >
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
