<div class="text-center p-2">
    <div class="col-xs-1 border" align="center">
        <form
            #gameEditForm = "ngForm"
            name="form"
            (ngSubmit)="gameEditForm.form.valid && onSubmit()"
            novalidate
        >
            <div class="bg-success text-white text-center m-2 p-2 font-weight-bold">
                <h5>Wedstrijd</h5>
            </div>
            <div class="text-success">
                <h6 class="font-weight-bold">Wedstrijd informatie</h6>
            </div>
            <div class="row font-weight-bold">
                <div class="col text-success">
                    <label for="Name">
                        Naam:
                    </label>
                </div>
                <div class="col text-success">
                    <label for="date">
                        Datum:
                    </label>
                </div>
                <div class="col text-success">
                    <label for="winner">
                        Winnaar:
                    </label>
                </div>
            </div>
            <div class="row text-success">
                <div class="col">
                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="game.name"
                        name="name"
                        #name="ngModel"
                        [ngClass]="{
                            'is-invalid': name.invalid
                        }"
                        required
                    />
                </div>
                <div
                    *ngIf="name.invalid && name.touched"
                    class="invalid-feedback"
                >
                    <div>Naam moet gevuld zijn.</div>
                </div>
                <div class="col">
                    <input
                        type="date"
                        class="form-control"
                        [(ngModel)]="game.date"
                        name="date"
                        #date="ngModel"
                        [ngClass]="{
                            'is-invalid': date.invalid
                        }"
                        required
                    />
                </div>   
                <div
                    *ngIf="date.invalid && date.touched"
                    class="invalid-feedback"
                >
                    <div>Er moet een datum zijn.</div>
                </div>
                <div class="col">
                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="game.winner"
                        name="winner"
                        #winner="ngModel"
                        [ngClass]="{
                            'is-invalid': winner.invalid
                        }"
                    />
                </div>        
            </div>
            <hr>
            <div class="text-success">
                <h6 class="font-weight-bold">Locatie informatie</h6>
            </div>
            <div class="row font-weight-bold">
                <div class="col text-success"><label for="location">Locatie naam:</label></div>
                <div class="col text-success"><label for="holes">Holes:</label></div>
            </div>
            <div class="row text-success">
                <div class="col">
                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="game.location"
                        name="location"
                        #location="ngModel"
                        [ngClass]="{
                            'is-invalid': location.invalid
                        }"
                        required
                    />
                </div>   
                <div
                    *ngIf="location.invalid && location.touched"
                    class="invalid-feedback"
                >
                    <div>Er moet een locatie zijn.</div>
                </div>      
                <div class="col">
                    <input
                        type="number"
                        min="1"
                        max="18"
                        class="form-control"
                        [(ngModel)]="game.holes"
                        name="holes"
                        #holes="ngModel"
                        [ngClass]="{
                            'is-invalid': holes.invalid
                        }"
                        required
                    />
                </div>   
                <div
                    *ngIf="holes.invalid && holes.touched"
                    class="invalid-feedback"
                >
                    <div>Er moeten holes zijn.</div>
                </div> 
            </div>
            <hr>
            <div class="row font-weight-bold">
                <button
                    type = "submit"
                    class="btn btn-success mt-3"
                    [disabled]="!gameEditForm.valid"
                >
                    Save
                </button>
                <button
                    type = "button"
                    class="btn btn-success mt-3"
                    routerLink=".."
                >
                    Cancel
                </button>
            </div>
        </form>
        <div class="text-success">
            <h6 class="font-weight-bold">Teams</h6>
        </div>
        <table class="table table-bordered table-striped table-sm">
            <thead>
                <tr>
                    <th class="text-center text-success">Naam</th>
                    <th class="text-center text-success">Rank</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let team of game?.teams">
                    <td class="text-center">{{ team.name }}</td>
                    <td class="text-center">{{ team.rank }}</td>
                </tr>
            </tbody>
        </table>
        @if(game.gameManager?._id === currentUser?._id) {
            <div class="col">
                <input
                    type="text"
                    [(ngModel)]="teamName"
                    name="teamName"
                />
            </div>
            <div class="col" align="center"><button class="btn btn-success mt-3" (click)="addTeam(teamName)" routerLinkActive="actieve-link">Voeg toe</button></div>
        }
    </div>
</div>
